name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run code checks
        run: pnpm run codecheck

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # port: ${{ secrets.VPS_PORT || 22 }}
          # Login shell loads ~/.profile (often sources ~/.bashrc), so nvm/pnpm
          # match an interactive SSH session. Plain remote commands are non-interactive
          # and skip those files, which is why pnpm was missing from PATH.
          script: |
            bash -l -c "set -e && cd /var/www/mooduck && ./deploy.sh"
